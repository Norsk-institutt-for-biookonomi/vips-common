  ALTERNARIA_PROJECT_ID: "173"
  APPLESCABM_PROJECT_ID: "20"
  BARLEYNETB_PROJECT_ID: "21"
  BREMIALACT_PROJECT_ID: "22"
  DELIARADIC_PROJECT_ID: "24"
  DELIARFOBS_PROJECT_ID: "25"
  DOWNCASTMO_PROJECT_ID: "26"
